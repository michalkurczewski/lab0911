<!DOCTYPE html>
<html lang="pl">
<head>

    <meta charset="UTF-8">
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <div class = "kalkulator">
        <input id="display" readonly>
        <div class = "przyciski">
            <button onclick = "dodajDoWidoku('+')" class = "policzedycja">+</button>
            <button onclick = "dodajDoWidoku('7')">7</button>
            <button onclick = "dodajDoWidoku('8')">8</button>
            <button onclick = "dodajDoWidoku('9')">9</button>
            <button onclick = "dodajDoWidoku('-')" class = "policzedycja">-</button>
            <button onclick = "dodajDoWidoku('4')">4</button>
            <button onclick = "dodajDoWidoku('5')">5</button>
            <button onclick = "dodajDoWidoku('6')">6</button>
            <button onclick = "dodajDoWidoku('*')" class = "policzedycja">*</button>
            <button onclick = "dodajDoWidoku('1')">1</button>
            <button onclick = "dodajDoWidoku('2')">2</button>
            <button onclick = "dodajDoWidoku('3')">3</button>
            <button onclick = "dodajDoWidoku('/')" class = "policzedycja">/</button>
            <button onclick = "dodajDoWidoku('0')">0</button>
            <button onclick = "dodajDoWidoku('.')">.</button>
            <button onclick = "policz('=')">=</button>
            <button onclick = "wyczyscwidok('clearDisplay')" class = "policzedycja">C</button>
        </div>
    </div>
    <script src = "funkcjejava.js"></script>
      
   
</body>
</html>
